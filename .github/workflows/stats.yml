# Every 6 hours: refresh data/stats.json from the Instagram + YouTube APIs and commit it.
# The site reads the file from raw.githubusercontent.com, so new numbers show up
# without waiting for a GitHub Pages rebuild.
name: stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch stats
        run: python -u stats/fetch_stats.py
        env:
          IG_TOKEN_MEDCOMIX: ${{ secrets.IG_TOKEN_MEDCOMIX }}
          IG_TOKEN_TECHCOMIX: ${{ secrets.IG_TOKEN_TECHCOMIX }}
          IG_TOKEN_360COMIX: ${{ secrets.IG_TOKEN_360COMIX }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_HANDLES: MedComix
          OUT: data/stats.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "stats: auto update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
